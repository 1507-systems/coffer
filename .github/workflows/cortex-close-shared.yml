name: Close Cortex Issues (shared)
# Shared reusable at-merge Cortex issue closer. Public so it can be called by
# any 1507 repo regardless of visibility/org. Holds NO secrets — the caller
# passes CORTEX_WRITE_TOKEN at runtime, by name under `secrets:` (declared
# below, so `secrets: inherit` is not needed); it never touches this repo.
# Callers MUST pin to a commit SHA (supply-chain safety), at or after
# coffer#40 (the trust model below). Epic 4a283f45.
# Runs only for a push to the caller's default branch; any other event
# or ref skips the job.
# Runner: private callers pass `runs_on` (e.g. their RUNNER_LABEL
# variable). A public caller's `runs_on` is ignored and the job runs on
# GitHub-hosted ubuntu-latest (free for public repos); runner-group repo
# access remains the real gate for self-hosted runners. The runner needs
# bash 4+ first on PATH, curl 7.55+, git, gh and jq.
# Trust: put closing references in the PR body, on a line of their own
# ("Closes cortex:issue/<uuid>"; quoted, fenced and HTML-comment lines
# are ignored). For a PR merged as the pushed commit, only its body is
# scanned, and only when a person opened it from a branch in the
# caller's repo (write access). Bot PRs (their bodies quote upstream
# release notes; a [bot] login or a renovate/ or dependabot/ branch
# counts) and merged fork PRs are skipped. With no merged PR the lookup
# is retried (GitHub links PRs to commits a little after the push); then
# a direct push by a person is scanned by its head commit's message, so
# whoever pushes someone else's commits vouches for them. Pushes by bots
# and GitHub-made commits with no PR are skipped. Close skipped issues
# by hand.
# Known limit: the token can close any issue in the Cortex instance;
# nothing ties an issue to the calling repo.
# Callers MUST set `contents: read` and `pull-requests: read` on the
# job; if the caller's token lacks either, the run fails at startup.
# The Cortex base URL is the caller's: pass `cortex_api_base` or set a
# CORTEX_API_BASE Actions variable. With neither the job is a no-op.
on:
  workflow_call:
    inputs:
      cortex_api_base:
        description: Cortex REST base URL (falls back to the caller's CORTEX_API_BASE variable)
        required: false
        type: string
      runs_on:
        description: Runner label; honoured for private callers only (public callers use ubuntu-latest)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CORTEX_WRITE_TOKEN:
        description: Cortex write-scope API token (marks referenced issues done)
        required: true
# pull-requests: read lets a private repo's token list the merged
# commit's PRs; callers must grant it too.
permissions:
  contents: read
  pull-requests: read
jobs:
  close-cortex-issue:
    name: Close referenced Cortex issues
    if: >-
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ github.event.repository.private && inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout (commit message and committer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Close referenced Cortex issues
        env:
          CORTEX_WRITE_TOKEN: ${{ secrets.CORTEX_WRITE_TOKEN }}
          CORTEX_API_BASE: ${{ inputs.cortex_api_base || vars.CORTEX_API_BASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          # No -e: every failure below is handled; the job is non-blocking.
          # +a too: a BASH_ENV `set -a` would re-export the token copies.
          # (BASH_ENV itself runs first, with the token exported: that is
          # the runner's and earlier steps' trust, not this script's.)
          set +ae -uo pipefail
          # Keep tokens out of child processes' environments; declare +x
          # drops an export the runner may already have on these names.
          declare +x _cortex_tok="${CORTEX_WRITE_TOKEN-}" _gh_tok="${GH_TOKEN-}"
          unset CORTEX_WRITE_TOKEN GH_TOKEN
          # Fail loudly: old bash or a missing tool would silently no-op.
          if [ "${BASH_VERSINFO[0]}" -lt 4 ]; then
            echo "::error::runner bash is ${BASH_VERSION}; need 4+."; exit 1
          fi
          for t in curl gh git jq; do
            command -v "$t" >/dev/null 2>&1 \
              || { echo "::error::runner is missing ${t}."; exit 1; }
          done
          # -H @file (used below) needs curl 7.55+.
          cv="$(curl --version | head -n1 | cut -d' ' -f2)"
          IFS=. read -r cmaj cmin _ <<< "${cv}"
          if ! [[ "${cmaj}" =~ ^[0-9]+$ && "${cmin}" =~ ^[0-9]+$ ]]; then
            echo "::error::cannot parse curl version '${cv}'."; exit 1
          fi
          if [ "${cmaj}" -lt 7 ] || { [ "${cmaj}" -eq 7 ] && [ "${cmin}" -lt 55 ]; }; then
            echo "::error::runner curl is ${cv}; need 7.55+."; exit 1
          fi
          COMMIT_MSG="$(git log -1 --format=%B "${HEAD_SHA}" 2>/dev/null || true)"
          trap 'rm -f "${ERRF:-}" "${HDR:-}"' EXIT
          # Route signals through exit so the EXIT trap removes the files.
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ERRF="$(umask 077 && mktemp "${RUNNER_TEMP:-/tmp}/cortex-err.XXXXXX")" \
            || { echo "::warning::mktemp failed — skipping."; exit 0; }
          # The PR merged as this commit. With a merge queue only the last
          # PR in the batch matches; earlier ones are not scanned.
          # $sha and $repo are jq variables, not shell ones.
          # shellcheck disable=SC2016
          MERGED='[.[] | objects
            | select(.merged_at != null and .merge_commit_sha == $sha)]'
          # Not a person: a non-User type (fails closed if `user` is not
          # an object), a [bot] login, or a bot's branch name.
          # shellcheck disable=SC2016
          BOT='((.user.type? // null) != "User")
            or ((.user.login? // "" | tostring) | endswith("[bot]"))
            or ((.head.ref? // "" | tostring)
              | test("^(renovate|dependabot)/"))'
          # shellcheck disable=SC2016
          CLASSIFY='if type != "array" then "bad"
            elif any(.[] | objects; (.head.repo.full_name? // ""
              | ascii_downcase) != ($repo | ascii_downcase)) then "fork"
            elif ('"${MERGED}"' | length) == 0 then "direct"
            elif any('"${MERGED}"'[]; '"${BOT}"') then "bot"
            else "branch" end'
          COMMITTER="$(git log -1 --format=%ce "${HEAD_SHA}" 2>/dev/null || true)"
          # GitHub may not have linked a just-merged PR (or a fork PR
          # pushed by hand) yet: retry before trusting "no PR".
          for attempt in 1 2 3 4; do
            # Fail closed: if the commit's PRs are unknown, scan nothing.
            if ! PR_JSON="$(GH_TOKEN="${_gh_tok}" gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls?per_page=100" 2>"${ERRF}")"; then
              # Print only the status; gh's other output is not ours to echo.
              st="$(grep -oE 'HTTP [0-9]{3}' "${ERRF}" | head -n1)"
              echo "::warning::PR lookup failed (${st:-no HTTP status}) — skipping."
              exit 0
            fi
            KIND="$(jq -r --arg sha "${HEAD_SHA}" --arg repo "${REPO}" \
              "${CLASSIFY}" <<< "${PR_JSON}" 2>/dev/null)"
            if [ "${KIND}" != direct ] || [ "${attempt}" -eq 4 ]; then
              break
            fi
            sleep 10
          done
          case "${KIND}" in
            direct)
              if [ "${COMMITTER}" = noreply@github.com ]; then
                echo "::warning::no PR found for a GitHub-made commit — skipping."
                exit 0
              fi
              if [ "${SENDER_TYPE:-}" != User ] \
                || [[ "${COMMITTER}" == *'[bot]@users.noreply.github.com' ]]; then
                echo "::notice::direct push not by a person; not trusted to close issues."
                exit 0
              fi
              PR_BODY="" ;;
            branch)
              COMMIT_MSG=""
              PR_BODY="$(jq -r --arg sha "${HEAD_SHA}" \
                "${MERGED}"' | .[] | .body // empty' <<< "${PR_JSON}")" \
                || PR_BODY="" ;;
            fork)
              echo "::notice::commit is in a fork PR; not trusted to close issues."
              exit 0 ;;
            bot)
              echo "::notice::merged PR was not opened by a person; not trusted to close issues."
              exit 0 ;;
            *)
              echo "::warning::PR lookup unreadable — skipping."
              exit 0 ;;
          esac
          unset PR_JSON
          SCAN_TEXT="$(printf '%s\n%s\n' "${COMMIT_MSG}" "${PR_BODY}")"
          # A reference counts only at the start of a line (after an
          # optional list marker), outside quotes, fences and comments.
          # shellcheck disable=SC2016
          STRIP='{ sub(/\r$/, "") }
            c { if (index($0, "-->")) c = 0; next }
            /^[[:space:]]*(```|~~~)/ { f = !f; next }
            f || /^[[:space:]]*>/ { next }
            /<!--/ { if (!index($0, "-->")) c = 1; next }
            { print }'
          mapfile -t IDS < <(printf '%s' "${SCAN_TEXT}" | awk "${STRIP}" \
            | grep -oiE '^[[:space:]]*([-*+][[:space:]]+)?(close[sd]?|fix(e[sd])?|resolve[sd]?|retire[sd]?):?[[:space:]]+cortex:issue/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            | sed -E 's#.*cortex:issue/##' | tr '[:upper:]' '[:lower:]' | sort -u)
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No cortex:issue/<uuid> closing references. Nothing to close."
            exit 0
          fi
          echo "Found ${#IDS[@]} cortex issue reference(s): ${IDS[*]}"
          # The secret is required, so this only catches an empty value.
          if [ -z "${_cortex_tok}" ]; then
            echo "::notice::CORTEX_WRITE_TOKEN not set — skipping (no-op)."
            exit 0
          fi
          if [ -z "${CORTEX_API_BASE}" ]; then
            echo "::notice::no cortex_api_base input and no CORTEX_API_BASE variable — skipping (no-op)."
            exit 0
          fi
          # The bearer token must never go out in cleartext.
          case "${CORTEX_API_BASE}" in
            https://*) ;;
            *) echo "::warning::CORTEX_API_BASE is not https:// — skipping."; exit 0 ;;
          esac
          case "${_cortex_tok}" in
            *$'\n'*|*$'\r'*)
              echo "::warning::CORTEX_WRITE_TOKEN has a CR/LF — skipping."
              exit 0 ;;
          esac
          # Header from a 0600 file so the token stays out of the process list.
          HDR="$(umask 077 && mktemp "${RUNNER_TEMP:-/tmp}/cortex-hdr.XXXXXX")" \
            || { echo "::warning::mktemp failed — skipping."; exit 0; }
          printf 'Authorization: Bearer %s\n' "${_cortex_tok}" > "${HDR}" \
            || { echo "::warning::cannot write header file — skipping."; exit 0; }
          AUTH=(-H "@${HDR}")
          # Prints the version as raw JSON. Returns 1 if not found, 2 if
          # every lookup failed (bad token, outage). The API has no get-by-id
          # or paging, so each query sees at most its first 200 issues.
          get_version() {
            local id="$1" resp v q ok=0
            for q in status=todo status=in_progress status=backlog status=blocked ""; do
              resp="$(curl -s -f --proto =https --max-time 10 "${AUTH[@]}" "${CORTEX_API_BASE}/issues?${q:+${q}&}limit=200" 2>/dev/null)" || continue
              # Only a JSON body with an issues array counts as a lookup.
              printf '%s' "$resp" | jq -e '.issues | type == "array"' >/dev/null 2>&1 || continue
              ok=1
              v="$(printf '%s' "$resp" | jq -c --arg id "$id" '.issues[] | objects | select(.id==$id) | .version | select(type == "number" or type == "string")' 2>/dev/null | head -n1)"
              [ -n "$v" ] && { printf '%s' "$v"; return 0; }
            done
            [ "${ok}" -eq 1 ] && return 1
            return 2
          }
          for id in "${IDS[@]}"; do
            version="$(get_version "$id")"
            case $? in
              0) ;;
              2) echo "::warning::${id}: lookup failed (token or API) — skipping."; continue ;;
              *) echo "  ${id}: not found — skipping."; continue ;;
            esac
            for attempt in 1 2; do
              payload="$(jq -nc --argjson v "$version" --arg id "$id" --arg a "$attempt" \
                --arg rid "${GITHUB_RUN_ID}" \
                '{version:$v, patch:{status:"done"}, request_id:("gh-merge-"+$rid+"-"+$id+"-"+$a)}')" \
                || { echo "::warning::${id}: cannot build PATCH payload — skipping."; break; }
              code="$(curl -s --proto =https -o /dev/null -w '%{http_code}' --max-time 10 -X PATCH "${AUTH[@]}" \
                -H 'Content-Type: application/json' -d "$payload" "${CORTEX_API_BASE}/issues/${id}" 2>/dev/null)" || code="${code:-000}"
              case "$code" in
                200) echo "  ${id}: closed (status=done)."; break ;;
                409)
                  if [ "${attempt}" -eq 2 ]; then
                    echo "::warning::${id}: version_conflict again — skipping."; break
                  fi
                  echo "  ${id}: version_conflict; re-fetching."
                  version="$(get_version "$id")" \
                    || { echo "::warning::${id}: re-fetch failed — skipping."; break; } ;;
                403) echo "::warning::${id}: 403 — token lacks write scope."; break ;;
                *)   echo "::warning::${id}: HTTP ${code} — skipping (non-blocking)."; break ;;
              esac
            done
          done
          exit 0
