name: Close Cortex Issues (shared)
# Shared reusable at-merge Cortex issue closer. Public so it can be called by
# any 1507 repo regardless of visibility/org. Holds NO secrets — the caller
# passes CORTEX_WRITE_TOKEN at runtime, by name under `secrets:` (declared
# below, so `secrets: inherit` is not needed); it never touches this repo.
# Callers MUST pin to a commit SHA (supply-chain safety) that contains
# coffer#40's merge (the trust model below). Epic 4a283f45.
# Runs only for a push to the caller's default branch; any other event
# or ref skips the job.
# Runner: private callers pass `runs_on` (e.g. their RUNNER_LABEL
# variable). A public caller's `runs_on` is ignored and the job runs on
# a runner labelled ubuntu-latest: GitHub-hosted (free for public
# repos) unless a self-hosted runner the repo can reach also carries
# that label, so runner-group repo access remains the real gate. The
# runner needs bash 4.4+ with the compgen builtin, curl 7.55+, jq 1.5+
# with regex support, gh, a base64 that takes -d, an env that takes -0,
# grep, sort, head, cut, mktemp, rm and sleep. Each must exist, and
# bash, curl, jq, base64 and env are also checked by version or
# feature; the job fails otherwise. Tested on bash 5.2, jq
# 1.7 and curl 8.
# Trust: only the body of a PR merged into the default branch is
# scanned, and only when all of these hold:
# - the push's sender (type User) opened it and is GitHub's mergedBy,
#   and the run was started by that push or a re-run by the sender;
# - it is from a branch in the caller's repo;
# - it is not a bot's (a non-User type, a [bot] login, or a renovate/
#   or dependabot/ branch, any case);
# - nobody but its opener ever edited the body.
# If any PR listed for the commit is from a fork, nothing is scanned.
# Commit messages are never scanned, so a push with no such PR behind
# it closes nothing. Force-pushes close nothing (the push's forced
# flag), nor do bot or App pushes: every merge-queue push is sent by
# github-merge-queue[bot], so it stops at the sender check.
# A body GitHub pre-filled (from commit messages or a template) counts
# as the opener's: they submitted it. The lookup is retried while no
# merged PR is listed (GitHub links a PR to its merge commit a little
# after the push) or a call fails with 429, 5xx, a 403 rate limit or
# no HTTP status (a network or GraphQL error). Close skipped issues by
# hand. A re-run by the sender re-reads the body as it is now, so it
# closes again any referenced issue reopened since the merge, and also
# closes the issues of references the sender has since added at the
# top; a re-run by anyone else closes nothing.
# References must open the body: blank lines aside, the first lines are
# read while each is exactly a keyword (close, closes, closed, fix,
# fixes, fixed, resolve, resolves, resolved, retire, retires, retired;
# an optional colon), blanks, then cortex:issue/<uuid>, and only blanks
# after it, matched case-insensitively. The line may start with "- ",
# "* " or "+ ", e.g. "- Closes cortex:issue/<uuid>". Reading stops at
# the first other line; any other reference closes nothing (a notice
# says so). Only references and blank lines come before a reference,
# so no Markdown can hide it. Matching is in the C locale: blanks are
# space and tab only. A body containing a NUL is not trusted.
# Known limit: CORTEX_WRITE_TOKEN is a general write-scope token. Anyone
# trusted above, in any caller repo, can close any issue in the Cortex
# instance (issue UUIDs appear in public repos); anyone who can run a
# workflow in a caller repo, or code on its runner, can take the token
# (e.g. from this step's /proc environ, or through the runner's PATH,
# proxy or CA settings).
# An account that opens and merges its own PRs is trusted as a person,
# even a machine user; agents that open and merge PRs under a person's
# account are trusted as that person.
# Callers MUST set `contents: read` and `pull-requests: read` on the
# job; if the caller's token lacks either, the run fails at startup.
# The Cortex base URL is the caller's: pass `cortex_api_base` or set a
# CORTEX_API_BASE Actions variable. With neither the job is a no-op,
# checked before any GitHub lookup.
on:
  workflow_call:
    inputs:
      cortex_api_base:
        description: Cortex REST base URL (falls back to the caller's CORTEX_API_BASE variable)
        required: false
        type: string
      runs_on:
        description: Runner label; honoured for private callers only (public callers use ubuntu-latest)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CORTEX_WRITE_TOKEN:
        description: Cortex write-scope API token (marks referenced issues done)
        required: true
# pull-requests: read lets a private repo's token list the merged
# commit's PRs; callers must grant it too.
permissions:
  contents: read
  pull-requests: read
jobs:
  close-cortex-issue:
    name: Close referenced Cortex issues
    if: >-
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ github.event.repository.private && inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Close referenced Cortex issues
        env:
          CORTEX_WRITE_TOKEN: ${{ secrets.CORTEX_WRITE_TOKEN }}
          CORTEX_API_BASE: ${{ inputs.cortex_api_base || vars.CORTEX_API_BASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCED: ${{ github.event.forced }}
          TRIGGER_LOGIN: ${{ github.triggering_actor }}
        # -p: bash ignores SHELLOPTS, BASHOPTS, BASH_ENV, ENV and exported
        # functions from the environment (see the comments below).
        shell: bash --noprofile --norc -p -o pipefail {0}
        run: |
          # No -e: lookup and API failures are handled and do not fail the
          # job. A runner without the tools below fails it, and so does a
          # gh call that hangs until timeout-minutes (gh has no timeout);
          # curl calls have --max-time, and no call starts after 8 min.
          # bash -p (see shell:) reads no BASH_ENV and imports no
          # SHELLOPTS, BASHOPTS or functions, so nothing runs before this
          # line. The set and export -n lines below are a backstop for
          # shell options only, and not for noexec (nothing would run):
          # without -p, BASH_ENV and exported functions would still act,
          # so -p must stay.
          # +a: an inherited allexport would re-export the token copies.
          # +xv: an inherited SHELLOPTS would trace the token to the log;
          # the first set +x has stdout and stderr on /dev/null, so its
          # own trace goes there, whatever PS4 holds, unless
          # BASH_XTRACEFD names an fd other than 1 or 2 that is open for
          # writing (the runner opens none). Un-exported, SHELLOPTS no
          # longer reaches child shells either (nor would it past the
          # allowlist below).
          # +o posix: POSIXLY_CORRECT turns posix mode on even under -p,
          # and old bash then rejects the process substitutions below.
          # +C: an inherited noclobber would block the writes to ERRF.
          # +k: keyword mode would turn the declare +x words below into
          # env assignments, leaving a bare declare +x, which prints
          # every variable.
          { set +x; } >/dev/null 2>&1
          set +aeCkxv +o posix -uo pipefail
          export -n SHELLOPTS BASHOPTS
          # ASCII classes and case folding, whatever the runner's locale.
          export LC_ALL=C
          # Time from here, whatever SECONDS the environment held.
          SECONDS=0
          # An inherited FUNCNEST would break the nested helpers, and a
          # TMOUT would make read time out and drop body lines. BASH_ENV
          # and ENV are dropped so no child shell runs them either (the
          # allowlist below also covers that), and BASH_COMPAT so this
          # bash keeps its own behaviour.
          unset FUNCNEST TMOUT BASH_ENV ENV BASH_COMPAT
          # Unset and empty mean the same below.
          : "${CORTEX_API_BASE:=}" "${REPO:=}" "${HEAD_SHA:=}" \
            "${SENDER_TYPE:=}" "${SENDER_LOGIN:=}" "${DEFAULT_BRANCH:=}" \
            "${FORCED:=}" "${TRIGGER_LOGIN:=}"
          # Keep tokens out of child processes' environments; declare +x
          # drops an export the runner may already have on these names.
          declare +x _cortex_tok="${CORTEX_WRITE_TOKEN-}" _gh_tok="${GH_TOKEN-}"
          unset CORTEX_WRITE_TOKEN GH_TOKEN
          # Fail loudly: old bash or a missing tool would silently no-op.
          if [ "${BASH_VERSINFO[0]}" -lt 4 ] \
            || { [ "${BASH_VERSINFO[0]}" -eq 4 ] && [ "${BASH_VERSINFO[1]}" -lt 4 ]; }; then
            echo "::error::runner bash is ${BASH_VERSION}; need 4.4+."; exit 1
          fi
          if [ "$(type -t compgen)" != builtin ]; then
            echo "::error::runner bash has no compgen builtin."; exit 1
          fi
          # Every tool gets an allowlisted environment: PATH, LC_ALL and
          # the runner's proxy and CA settings (a known limit, above).
          # All else is un-exported, so no tool setting (gh's GH_HOST,
          # GH_DEBUG, DEBUG, GODEBUG or colour, curl's SSLKEYLOGFILE,
          # grep's GREP_OPTIONS, ...) reaches a child; a name bash cannot
          # un-export fails the job (below). The gh calls add GH_TOKEN,
          # GH_CONFIG_DIR, HOME and GH_TELEMETRY=0, and jq gets HOME.
          # shellcheck disable=SC2163
          for v in $(compgen -e); do
            case "${v}" in
              PATH | LC_ALL | HTTPS_PROXY | https_proxy | HTTP_PROXY) ;;
              http_proxy | ALL_PROXY | all_proxy | NO_PROXY | no_proxy) ;;
              SSL_CERT_FILE | SSL_CERT_DIR | CURL_CA_BUNDLE) ;;
              *) export -n "${v}" ;;
            esac
          done
          # bash cannot un-export an entry whose name is not a shell name
          # (e.g. BASH_FUNC_x%%) and passes it on; a tool that is a bash
          # script would import it, so such an entry fails the job.
          if ! command -v env >/dev/null 2>&1 || ! env -0 >/dev/null 2>&1; then
            echo "::error::runner env is missing or lacks -0."; exit 1
          fi
          odd=0
          while IFS= read -r -d '' e; do
            [[ "${e}" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || odd=1
          done < <(env -0)
          unset e
          if [ "${odd}" -ne 0 ]; then
            echo "::error::runner environment has a name bash cannot un-export."
            exit 1
          fi
          for t in curl gh jq base64 grep sort head cut mktemp rm sleep; do
            command -v "$t" >/dev/null 2>&1 \
              || { echo "::error::runner is missing ${t}."; exit 1; }
          done
          # Runner residue must not steer the tools that decide trust: jq
          # loads ~/.jq into every program and gh reads ~/.config/gh, so
          # both get an empty private directory instead (curl gets -q).
          ISO="$(umask 077 && mktemp -d "${RUNNER_TEMP:-/tmp}/cortex-iso.XXXXXX")" \
            || { echo "::warning::mktemp failed — skipping."; exit 0; }
          # Cleared first, so an inherited ERRF names no file to delete.
          ERRF=
          trap 'rm -rf "${ISO:-}"; rm -f "${ERRF:-}"' EXIT
          jq() { HOME="${ISO}" command jq "$@"; }
          if [ "$(printf 'eA==' | base64 -d 2>/dev/null)" != x ]; then
            echo "::error::runner base64 does not decode with -d."; exit 1
          fi
          jv="$(jq --version 2>/dev/null)"
          if ! [[ "${jv}" =~ ^jq-([0-9]+)\.([0-9]+) ]] \
            || [ "${BASH_REMATCH[1]}" -lt 1 ] \
            || { [ "${BASH_REMATCH[1]}" -eq 1 ] && [ "${BASH_REMATCH[2]}" -lt 5 ]; }; then
            echo "::error::runner jq is '${jv}'; need 1.5+."; exit 1
          fi
          if [ "$(jq -n '"A" | test("a"; "i")' 2>/dev/null)" != true ]; then
            echo "::error::runner jq has no regex support (test)."; exit 1
          fi
          # -H @- (used below) needs curl 7.55+.
          cv="$(curl -q --version | head -n1 | cut -d' ' -f2)"
          IFS=. read -r cmaj cmin _ <<< "${cv}"
          if ! [[ "${cmaj}" =~ ^[0-9]+$ && "${cmin}" =~ ^[0-9]+$ ]]; then
            echo "::error::cannot parse curl version '${cv}'."; exit 1
          fi
          if [ "${cmaj}" -lt 7 ] || { [ "${cmaj}" -eq 7 ] && [ "${cmin}" -lt 55 ]; }; then
            echo "::error::runner curl is ${cv}; need 7.55+."; exit 1
          fi
          if [ "${SENDER_TYPE}" != User ] || [ -z "${SENDER_LOGIN}" ]; then
            echo "::notice::push not made by a person; not trusted to close issues."
            exit 0
          fi
          if [ "${FORCED}" = true ]; then
            echo "::notice::force-push; it closes nothing."
            exit 0
          fi
          # A re-run keeps the push's sender; only the sender may re-run.
          if [ "${TRIGGER_LOGIN,,}" != "${SENDER_LOGIN,,}" ]; then
            echo "::notice::run started by someone other than the pusher; not trusted."
            exit 0
          fi
          # The secret is required, so this only catches an empty value.
          if [ -z "${_cortex_tok}" ]; then
            echo "::notice::CORTEX_WRITE_TOKEN is empty — skipping (no-op)."
            exit 0
          fi
          if [ -z "${CORTEX_API_BASE}" ]; then
            echo "::notice::no cortex_api_base input and no CORTEX_API_BASE variable — skipping (no-op)."
            exit 0
          fi
          while [[ "${CORTEX_API_BASE}" == */ ]]; do CORTEX_API_BASE="${CORTEX_API_BASE%/}"; done
          # The bearer token must never go out in cleartext, and the base
          # must be https://, a host (starting with a letter or digit), an
          # optional :port and a plain path.
          BASE_RE='^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?(/[A-Za-z0-9._~%/-]*)?$'
          if ! [[ "${CORTEX_API_BASE}" =~ ${BASE_RE} ]]; then
            echo "::warning::the Cortex base URL is not https:// and a host — skipping."
            exit 0
          fi
          case "${_cortex_tok}" in
            *$'\n'*|*$'\r'*)
              echo "::warning::CORTEX_WRITE_TOKEN has a CR/LF — skipping."
              exit 0 ;;
          esac
          # INT and TERM exit with their usual codes, through the EXIT
          # trap; being trapped, they also end a retry wait at once.
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # The sleep runs in the background, so wait returns at once on a
          # signal. Its output goes to /dev/null: a sleep left behind holds
          # no pipe or token and ends by itself within 10 s.
          nap() { sleep 10 >/dev/null 2>&1 & wait "$!"; }
          # Start no call after 8 minutes (checked before every call), so
          # slow Cortex answers end in a warning before timeout-minutes
          # (each curl call takes at most 10 s; a gh call has no limit).
          out_of_time() { [ "${SECONDS}" -ge 480 ]; }
          # 429, 5xx, a 403 whose message is GitHub's rate limit, or no
          # HTTP status at all (a network error, or a GraphQL-level error
          # such as RATE_LIMITED).
          retryable() {
            [[ -z "$1" || "$1" =~ ^HTTP\ (429|5[0-9][0-9])$ ]] && return 0
            [ "$1" = "HTTP 403" ] && grep -qi 'rate limit' "${ERRF}"
          }
          ERRF="$(umask 077 && mktemp "${RUNNER_TEMP:-/tmp}/cortex-err.XXXXXX")" \
            || { echo "::warning::mktemp failed — skipping."; exit 0; }
          # The PRs merged as this commit. A path that could meet a
          # non-object is read with (path)? (which guards every step) or
          # after a type check, so a wrong shape fails closed.
          # $sha, $def, $repo and $sender are jq variables, not shell ones.
          # shellcheck disable=SC2016
          MERGED='[.[] | objects
            | select(.merged_at != null and .merge_commit_sha == $sha
              and ((.base.ref)? // "") == $def)]'
          # Not a person: a non-User type (fails closed if `user` is not
          # an object), a [bot] or non-string login, or a bot's (or a
          # non-string) branch name.
          # shellcheck disable=SC2016
          BOT='(((.user.type)? // null) != "User")
            or ((.user.login)? // "" | type != "string" or endswith("[bot]"))
            or ((.head.ref)? // "" | type != "string"
              or test("^(renovate|dependabot)/"; "i"))'
          # Merged PRs a person opened and also merged (pushed).
          # shellcheck disable=SC2016
          OURS='['"${MERGED}"'[] | select(('"${BOT}"' | not)
            and ((.user.login)? // null | type == "string"
              and ascii_downcase == ($sender | ascii_downcase)))]'
          # A full page (100) may be truncated, and any entry that is not
          # an object is unreadable; both fail closed. A non-string head
          # repo full_name counts as a fork.
          # shellcheck disable=SC2016
          CLASSIFY='if type != "array" or length >= 100
              or any(.[]; type != "object") then "bad"
            elif any(.[] | objects; ((.head.repo.full_name)? // ""
              | type != "string"
                or ascii_downcase != ($repo | ascii_downcase))) then "fork"
            elif ('"${MERGED}"' | length) == 0 then "none"
            elif ('"${OURS}"' | length) == 0 then "other"
            else "ours" end'
          for attempt in 1 2 3 4; do
            if out_of_time; then
              echo "::warning::out of time before the PR lookup finished — skipping."
              exit 0
            fi
            # Fail closed: if the commit's PRs are unknown, scan nothing.
            if ! PR_JSON="$(GH_TOKEN="${_gh_tok}" GH_CONFIG_DIR="${ISO}" HOME="${ISO}" GH_TELEMETRY=0 gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls?per_page=100" 2>"${ERRF}")"; then
              # Print only the status; gh's other output is not ours to echo.
              st="$(grep -oE 'HTTP [0-9]{3}' "${ERRF}" | head -n1)"
              if retryable "${st}" && [ "${attempt}" -lt 4 ]; then
                nap; continue
              fi
              echo "::warning::PR lookup failed (${st:-no HTTP status}) — skipping."
              exit 0
            fi
            KIND="$(jq -r --arg sha "${HEAD_SHA}" --arg def "${DEFAULT_BRANCH}" --arg repo "${REPO}" \
              --arg sender "${SENDER_LOGIN}" "${CLASSIFY}" <<< "${PR_JSON}" 2>/dev/null)"
            if [ "${KIND}" != none ] || [ "${attempt}" -eq 4 ]; then
              break
            fi
            nap
          done
          case "${KIND}" in
            ours) ;;
            none)
              echo "::notice::no PR merged into the default branch as this commit; nothing to close."
              exit 0 ;;
            fork)
              echo "::notice::commit is in a fork PR; not trusted to close issues."
              exit 0 ;;
            other)
              echo "::notice::merged PR is a bot's or was opened by someone else; not trusted."
              exit 0 ;;
            *)
              echo "::warning::PR lookup unreadable — skipping."
              exit 0 ;;
          esac
          mapfile -t NUMS < <(jq -r --arg sha "${HEAD_SHA}" --arg def "${DEFAULT_BRANCH}" \
            --arg sender "${SENDER_LOGIN}" "${OURS}"'[] | .number
            | if type == "number" then tostring else "bad" end' <<< "${PR_JSON}" 2>/dev/null)
          unset PR_JSON
          # Any trusted PR without a whole number fails closed as a whole.
          bad=0
          for n in "${NUMS[@]}"; do [[ "${n}" =~ ^[0-9]+$ ]] || bad=1; done
          if [ "${#NUMS[@]}" -eq 0 ] || [ "${bad}" -eq 1 ]; then
            echo "::warning::PR lookup unreadable (a PR number) — skipping."
            exit 0
          fi
          mapfile -t NUMS < <(printf '%s\n' "${NUMS[@]}" | sort -un)
          # Body and edit history in one query, so the body scanned is
          # the one checked. Only a body nobody but the opener (also the
          # merger) ever edited counts: anyone else's edit, even after the
          # merge and then a re-run, would put their text under the
          # opener's name.
          # mergedBy must be the sender too, so pushing someone else's
          # merge commit (e.g. a fast-forward) closes nothing.
          # Logins, not IDs, are compared. All but the sender's are read
          # now; a rename since the push makes them differ (fails closed).
          # Each must also be a User (an App's GraphQL login has no [bot]
          # suffix), and a revision deleted from the edit history must
          # have been deleted by the sender.
          # shellcheck disable=SC2016
          GQL='query($o: String!, $r: String!, $n: Int!) {
            repository(owner: $o, name: $r) { pullRequest(number: $n) {
              author { __typename login } mergedBy { __typename login } body
              userContentEdits(first: 100) {
                totalCount nodes { editor { __typename login }
                  deletedBy { __typename login } } } } } }'
          # shellcheck disable=SC2016
          OWNED='def me: type == "object" and .__typename == "User"
              and (.login | type) == "string"
              and (.login | ascii_downcase) == ($sender | ascii_downcase);
            (.data.repository.pullRequest)?
            | select(type == "object")
            | select(.author | me)
            | select(.mergedBy | me)
            | select((.userContentEdits | type) == "object")
            | select((.userContentEdits.totalCount // 101) <= 100)
            | select((.userContentEdits.nodes | type) == "array"
              and (.userContentEdits.nodes | length)
                == .userContentEdits.totalCount)
            | select(all(.userContentEdits.nodes[]?;
              type == "object" and (.editor | me)
                and has("deletedBy")
                and (.deletedBy == null or (.deletedBy | me))))
            | select(.body == null or (.body | type) == "string")
            | (.body // "")
            | select(explode | all(. != 0))
            | "b:" + @base64'
          # One base64 line per trusted body, so each is read alone.
          # A NUL fails closed: bash's read would drop it silently.
          BODIES=(); BNUMS=()
          for n in "${NUMS[@]}"; do
            if out_of_time; then
              echo "::warning::out of time before PR #${n} — skipping all PRs."
              exit 0
            fi
            for attempt in 1 2 3; do
              if [ "${attempt}" -gt 1 ] && out_of_time; then
                echo "::warning::out of time in the PR #${n} lookup — skipping all PRs."
                exit 0
              fi
              # -f keeps owner and repo strings; -F makes n an Int.
              g="$(GH_TOKEN="${_gh_tok}" GH_CONFIG_DIR="${ISO}" HOME="${ISO}" GH_TELEMETRY=0 gh api graphql -f query="${GQL}" \
                -f o="${REPO%%/*}" -f r="${REPO#*/}" -F n="${n}" 2>"${ERRF}")" \
                && break
              st="$(grep -oE 'HTTP [0-9]{3}' "${ERRF}" | head -n1)"
              if retryable "${st}" && [ "${attempt}" -lt 3 ]; then
                nap; continue
              fi
              # Fail closed as a whole: no body is scanned.
              echo "::warning::PR #${n} lookup failed (${st:-no HTTP status}) — skipping all PRs."
              exit 0
            done
            b="$(jq -r --arg sender "${SENDER_LOGIN}" "${OWNED}" <<< "${g}" 2>/dev/null)"
            if [ "${b#b:}" = "${b}" ]; then
              echo "::notice::PR #${n}: its opener, merger or body edits are not all the pusher's, its body has a NUL, or the answer is unreadable; not trusted."
              continue
            fi
            BODIES+=("${b#b:}"); BNUMS+=("${n}")
          done
          # Read each body's leading reference block (see "References
          # must open the body" in the file header).
          # nocasematch makes =~ ignore case, so [0-9a-f] also takes A-F.
          # A cortex:issue/ on any other line closes nothing (a notice).
          UUID='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          REF="^([-*+] )?(close[sd]?|fix(e[sd])?|resolve[sd]?|retire[sd]?):?[[:blank:]]+cortex:issue/(${UUID})[[:blank:]]*\$"
          FOUND=()
          shopt -s nocasematch
          for i in "${!BODIES[@]}"; do
            lead=1; late=0
            while IFS= read -r line || [ -n "${line}" ]; do
              line="${line%$'\r'}"
              if [ "${lead}" -eq 1 ]; then
                [[ "${line}" =~ ^[[:blank:]]*$ ]] && continue
                if [[ "${line}" =~ ${REF} ]]; then
                  FOUND+=("${BASH_REMATCH[4],,}"); continue
                fi
                lead=0
              fi
              [[ "${line}" == *cortex:issue/* ]] && late=1
            done < <(printf '%s' "${BODIES[$i]}" | base64 -d 2>/dev/null)
            if [ "${late}" -eq 1 ]; then
              echo "::notice::PR #${BNUMS[$i]}: a cortex:issue/ is not on an exact reference line at the top of the body; it closes nothing."
            fi
          done
          shopt -u nocasematch
          mapfile -t IDS < <(printf '%s\n' "${FOUND[@]}" | grep . | sort -u)
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No cortex:issue/<uuid> closing references. Nothing to close."
            exit 0
          fi
          echo "Found ${#IDS[@]} cortex issue reference(s): ${IDS[*]}"
          if out_of_time; then
            echo "::warning::out of time before the Cortex calls — skipping."
            exit 0
          fi
          # The Authorization header goes to curl on stdin (-H @-), so the
          # token is in no process list and, on bash 5.1+, no file (older
          # bash writes a 0600 temp file and unlinks it at once). -q
          # (first) makes curl ignore any ~/.curlrc on the runner.
          cx() { curl -q -H @- "$@" <<< "Authorization: Bearer ${_cortex_tok}"; }
          # Each status list is fetched once (again after a 409), trimmed
          # to id and version. The API has no get-by-id or paging, so each
          # list holds at most its first 200 issues.
          declare -A LISTS=()
          LATE=0; LFAIL=0
          fetch_lists() {
            local q resp
            LISTS=(); LATE=0; LFAIL=0
            for q in todo in_progress backlog blocked "done"; do
              # A list not fetched in time is missing; LATE and LFAIL say
              # why in the warning.
              if out_of_time; then LATE=1; continue; fi
              resp="$(cx -s -f --proto =https --max-time 10 "${CORTEX_API_BASE}/issues?status=${q}&limit=200" 2>/dev/null)" \
                || { LFAIL=1; continue; }
              # Only a JSON body with an issues array counts as a lookup.
              resp="$(printf '%s' "$resp" | jq -ce '.issues | arrays | [.[] | objects | {id, version}]' 2>/dev/null)" \
                || { LFAIL=1; continue; }
              LISTS[$q]="$resp"
            done
          }
          # Prints the version (a JSON number). Returns 0 if open, 3 if
          # already done, 4 if found without a numeric version, 2 if not
          # found and a list is missing, 1 if not found.
          get_version() {
            local id="$1" v q failed=0
            for q in todo in_progress backlog blocked "done"; do
              [ -n "${LISTS[$q]+x}" ] || { failed=1; continue; }
              v="$(printf '%s' "${LISTS[$q]}" | jq -c --arg id "$id" '.[] | select(.id==$id) | .version' 2>/dev/null | head -n1)"
              if [ -n "$v" ]; then
                [ "$q" = "done" ] && return 3
                [[ "$v" =~ ^[0-9]+$ ]] || return 4
                printf '%s' "$v"; return 0
              fi
            done
            [ "${failed}" -eq 1 ] && return 2
            return 1
          }
          # Report a get_version result other than 0; returns 1 for those.
          looked_up() {
            case "$2" in
              0) return 0 ;;
              3) echo "  $1: already done." ;;
              4) echo "::warning::$1: found without a numeric version — skipping." ;;
              2)
                if [ "${LATE}" -eq 1 ] && [ "${LFAIL}" -eq 1 ]; then
                  echo "::warning::$1: a status list lookup failed (token or API), and the run ran out of time before the rest were fetched — skipping."
                elif [ "${LATE}" -eq 1 ]; then
                  echo "::warning::$1: out of time before its status lists were fetched — skipping."
                else
                  echo "::warning::$1: lookup failed (token or API) — skipping."
                fi ;;
              *) echo "::warning::$1: not found in the first 200 issues of any status — skipping." ;;
            esac
            return 1
          }
          fetch_lists
          for id in "${IDS[@]}"; do
            version="$(get_version "$id")"
            looked_up "$id" "$?" || continue
            for attempt in 1 2; do
              if out_of_time; then
                echo "::warning::${id}: out of time — skipping."; break
              fi
              payload="$(jq -nc --argjson v "$version" --arg id "$id" --arg a "$attempt" \
                --arg rid "${GITHUB_RUN_ID:-0}.${GITHUB_RUN_ATTEMPT:-1}" \
                '{version:$v, patch:{status:"done"}, request_id:("gh-merge-"+$rid+"-"+$id+"-"+$a)}')" \
                || { echo "::warning::${id}: cannot build PATCH payload — skipping."; break; }
              code="$(cx -s --proto =https -o /dev/null -w '%{http_code}' --max-time 10 -X PATCH \
                -H 'Content-Type: application/json' -d "$payload" "${CORTEX_API_BASE}/issues/${id}" 2>/dev/null)" || code="${code:-000}"
              case "$code" in
                2[0-9][0-9]) echo "  ${id}: closed (status=done)."; break ;;
                409)
                  if [ "${attempt}" -eq 2 ]; then
                    echo "::warning::${id}: version_conflict again — skipping."; break
                  fi
                  echo "  ${id}: version_conflict; re-fetching."
                  fetch_lists
                  version="$(get_version "$id")"
                  looked_up "$id" "$?" || break ;;
                403) echo "::warning::${id}: HTTP 403 (forbidden) — skipping."; break ;;
                *)   echo "::warning::${id}: HTTP ${code} — skipping (non-blocking)."; break ;;
              esac
            done
          done
          exit 0
